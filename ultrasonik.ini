; ASIO device name (leave empty or omit for first available ASIO device)
device=

; Sample rate in Hz (default: 44100)
sample_rate=44100

; Bit depth: 16, 24, or 32 (default: 24)
; Note: the actual ASIO output format is determined by the driver's native
; format. This setting controls the format reported to DirectSound clients.
bit_depth=24

; Buffer size in samples (default: 192, which is ~4ms at 44100Hz)
; Set to 0 to use the ASIO driver's preferred buffer size.
;
; Common values at 44100Hz:
;   64  = ~1.5ms (very low latency, may cause crackling)
;   128 = ~2.9ms
;   192 = ~4.4ms (recommended, matches beatmania IIDX INFINITAS)
;   256 = ~5.8ms
;   512 = ~11.6ms (safe fallback)
buffer_size=192
